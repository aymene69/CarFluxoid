name: Source and image-tool checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: ./scripts/prepare-catplay.sh
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q carfluxoid.py tooling scripts
      - run: for script in scripts/*.sh tooling/*.sh deploy/*.sh deploy/catplay_c2a; do sh -n "$script"; done
