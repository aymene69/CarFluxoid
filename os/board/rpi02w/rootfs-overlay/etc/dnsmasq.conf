user=root
interface=wlan0
bind-interfaces
listen-address=192.168.50.2
dhcp-range=192.168.50.10,192.168.50.50,255.255.255.0,12h
# Omit router (3) and DNS (6) options so iOS keeps 4G/5G cellular data active during CarPlay and AirPlay.
dhcp-option=3
dhcp-option=6
address=/carfluxoid.local/192.168.50.2
no-resolv
no-poll
dhcp-leasefile=/run/dnsmasq.leases
pid-file=/run/dnsmasq.pid
