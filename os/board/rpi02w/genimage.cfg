image boot.vfat {
	vfat {
		label = "CARFLUXBOOT"
		files = {
			"bcm2710-rpi-zero-2-w.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/overlays",
			"Image"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "CARFLUXDATA"
		use-mke2fs = true
	}
	size = 256M
}

image carfluxoid-os.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 128M
	}

	partition rootfs_b {
		partition-type = 0x83
		size = 128M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
