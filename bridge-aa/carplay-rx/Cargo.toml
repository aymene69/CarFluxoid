[package]
name="catplay-aa-rx"
version="0.1.0"
edition="2024"
[dependencies]
image={version="0.25.10",default-features=false,features=["png"]}
carfluxoid-dashboard-ui={path="../../dashboard-ui"}
catplay_carplay={path="../../catplay/carplay/catplay_carplay",default-features=false}
catplay_carplay_rx_gadget={path="../../catplay/catplay_carplay_rx_gadget"}
catplay_hap={path="../../catplay/core/catplay_hap"}
catplay_mfi={path="../../catplay/core/catplay_mfi",features=["local"]}
catplay_util={path="../../catplay/core/catplay_util"}
async-trait="0.1.89"
tokio={version="1",features=["rt","rt-multi-thread","macros","signal","time","net","io-util","sync"]}
log="0.4"
env_logger="0.11"
openssl={version="0.10",features=["vendored"]}
catplay_bt={path="../../catplay/bluetooth/catplay_bt"}
catplay_hid={path="../../catplay/carplay/catplay_hid"}
catplay_csm={path="../../catplay/core/catplay_csm"}
catplay_iap2_client={path="../../catplay/async/catplay_iap2_client"}
macaddr="1.0.1"
dbus={version="0.9.9",features=["stdfd"]}
libc="0.2"
serde={version="1",features=["derive"]}
serde_json="1"
